name: Finalize GW1 Data

on:
  push:
    branches:
      - update/gw1-final-2026-08-25
    paths:
      - '.github/workflows/finalize-gw1.yml'
      - 'scripts/fetch_gw_data_fixed.py'

concurrency:
  group: finalize-gw1-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-gw1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: update/gw1-final-2026-08-25
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch final GW1 data for all tracked leagues
        run: |
          python scripts/fetch_gw_data_fixed.py --gw 1 --league 19292 58005 687126 131997 --max 3000 --workers 16

      - name: Generate GW1 reports for all tracked leagues
        run: |
          for lid in 19292 58005 687126 131997; do
            python scripts/generate_analysis.py --gw 1 --league "$lid"
          done

      - name: Validate all generated datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          leagues = (19292, 58005, 687126, 131997)
          for lid in leagues:
              full_path = Path(f'data/gw1_league{lid}_data.json')
              compact_path = Path(f'data/gw1_league{lid}_compact.json')
              assert full_path.exists(), full_path
              assert compact_path.exists(), compact_path

              full = json.loads(full_path.read_text())
              compact = json.loads(compact_path.read_text())

              assert full['gw'] == 1
              assert compact['gw'] == 1
              assert full['league_id'] == lid
              assert compact['league_id'] == lid
              assert full['total_entries'] == len(full['competitors'])
              assert compact['total_entries'] == len(compact['competitors'])
              assert full['total_entries'] > 0
              assert full.get('errors', 0) < full['total_entries']

              full_ids = {c['entry_id'] for c in full['competitors']}
              compact_ids = {c['entry_id'] for c in compact['competitors']}
              assert full_ids == compact_ids

              print(lid, full['total_entries'], 'entries', 'errors=', full.get('errors', 0))
          PY

      - name: Commit refreshed GW1 snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gw1_league19292_data.json \
                  data/gw1_league19292_compact.json \
                  data/gw1_league58005_data.json \
                  data/gw1_league58005_compact.json \
                  data/gw1_league687126_data.json \
                  data/gw1_league687126_compact.json \
                  data/gw1_league131997_data.json \
                  data/gw1_league131997_compact.json \
                  reports/GW1
          if git diff --cached --quiet; then
            echo 'No GW1 data changes to commit.'
          else
            git commit -m 'data: finalize GW1 live snapshot for all tracked leagues'
            git push origin HEAD:update/gw1-final-2026-08-25
          fi
