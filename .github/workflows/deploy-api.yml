name: Deploy read API to Cloud Run

on:
  push:
    branches: [master]
    paths:
      - "services/api/**"
      - "cloudbuild.api.yaml"
      - "data/bootstrap_cache.json"
      - "data/fixtures_cache.json"
      - "data/gw*_league*_data.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-fpl-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and deploy Cloud Run API
        run: gcloud builds submit --project "${{ vars.GCP_PROJECT_ID }}" --config cloudbuild.api.yaml .
      - name: Verify production API
        run: |
          python - <<'PY'
          import json, urllib.request
          base = "https://fpl-scout-api-bztsnhv3ea-uc.a.run.app"
          with urllib.request.urlopen(base + "/health", timeout=30) as response:
              payload = json.load(response)
          assert payload["status"] == "ok", payload
          with urllib.request.urlopen(base + "/v1/autopilot/control-centre", timeout=60) as response:
              control = json.load(response)
          assert control["writes_enabled"] is False
          assert control["execution_authority"] == "telegram"
          print("Cloud Run API and read-only bridge are healthy")
          PY

