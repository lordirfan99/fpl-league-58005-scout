name: Validate application

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          FPL_API_BASE_URL: https://fpl-scout-api-bztsnhv3ea-uc.a.run.app

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: python -m pip install -r services/api/requirements.txt
      - run: python -m pytest services/api/tests
        env:
          PYTHONPATH: services/api
      - run: >-
          python -m py_compile
          integration/gcp-bot/dashboard_bridge.py
          scripts/run_gw_pipeline.py
          scripts/fetch_gw_data_fixed.py
          scripts/capture_predeadline_journal.py
          scripts/build_gameweek_journal.py
          scripts/journal_notes.py
