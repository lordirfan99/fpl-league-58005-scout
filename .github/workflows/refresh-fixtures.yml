name: Refresh FPL Fixtures

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-fpl-fixtures
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch official fixture horizon
        run: python scripts/fetch_fixture_horizon.py
      - name: Commit fixture changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures_cache.json
          if git diff --cached --quiet; then
            echo "Fixture schedule unchanged."
          else
            git commit -m "data: refresh official FPL fixtures"
            git push
          fi
