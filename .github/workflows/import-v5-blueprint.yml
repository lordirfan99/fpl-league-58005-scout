name: Import V5 Blueprint

on:
  push:
    paths:
      - 'docs/.v5fixed_payload.b64.part*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Decode blueprint payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          parts = sorted(Path('docs').glob('.v5fixed_payload.b64.part*'))
          if len(parts) < 4:
              raise SystemExit(f'Waiting for all 4 payload parts; found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          target = Path('docs/FPL_V5_Player_Intelligence_Implementation_Blueprint.md')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
      - name: Commit blueprint and clean import files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FPL_V5_Player_Intelligence_Implementation_Blueprint.md
          git rm -f docs/.v5fixed_payload.b64.part*
          git rm -f docs/.v5_blueprint_payload.b64.part0 || true
          git rm -f .github/workflows/import-v5-blueprint.yml
          git commit -m "docs: add V5 player intelligence implementation blueprint"
          git push
