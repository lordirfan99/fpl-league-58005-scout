name: Import V5 Blueprint

on:
  push:
    paths:
      - 'docs/.v5_blueprint_payload.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Decode blueprint payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload = Path('docs/.v5_blueprint_payload.b64')
          target = Path('docs/FPL_V5_Player_Intelligence_Implementation_Blueprint.md')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(gzip.decompress(base64.b64decode(payload.read_text(encoding='utf-8').strip())))
          PY
      - name: Commit blueprint and clean import files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FPL_V5_Player_Intelligence_Implementation_Blueprint.md
          git rm -f docs/.v5_blueprint_payload.b64
          git rm -f .github/workflows/import-v5-blueprint.yml
          git commit -m "docs: add V5 player intelligence implementation blueprint"
          git push
