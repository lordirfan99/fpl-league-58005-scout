name: Refresh complete live league snapshots

on:
  schedule:
    # Avoid GitHub Actions' top-of-hour congestion. The collector is portable
    # to Cloud Run Jobs; this workflow is the authenticated initial scheduler.
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: refresh-complete-live-leagues
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/api/requirements.txt
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Collect and publish only complete snapshots
        env:
          FPL_SNAPSHOT_BUCKET: ${{ vars.FPL_SNAPSHOT_BUCKET }}
        run: python scripts/refresh_live_leagues.py
